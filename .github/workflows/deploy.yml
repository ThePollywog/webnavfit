name: Deploy

# Builds WEBNAVFIT and publishes the static output to GitHub Pages. The app is
# 100% client-side (data in IndexedDB, PDF generation/editing via pdf-lib and
# pdf.js in the browser), so a static host is all it needs.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Bump package.json's patch version and commit it back to main so the
      # release history is a real, permanent semver progression (not just a
      # display-only build stamp). "[skip ci]" in the commit message keeps
      # this push from re-triggering the workflow on itself.
      - name: Bump patch version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version patch -m "chore: bump version to %s [skip ci]"
          git push origin HEAD:main --follow-tags

      # vite base is "./" (relative), so the build works under the Pages subpath.
      # GITHUB_RUN_NUMBER increments on every workflow run, so vite.config.js
      # further stamps each deployment with a build number (e.g. 1.0.1.42)
      # that shows in the navbar, on top of the semver patch bump above.
      - run: npm run build
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
